[package]
name = "batch-artifact-export"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic batch exports through the converters you already trust"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-batch-artifact-export"
homepage = "https://batch-artifact-export.sociobot.in"
readme = "README.md"
keywords = ["cli", "export", "artifacts", "documents", "batch"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", "scripts/", "packaging/", "winget/", "scoop-bucket/", ".factory/"]

[[bin]]
name = "batch-artifact-export"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tempfile = "3.21.0"
toml = "0.9.5"
wait-timeout = "0.2.1"
which = "8.0.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
